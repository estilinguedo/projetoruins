<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Definir nova senha — Plataforma de Jogadores</title>
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
        <link rel="stylesheet" href="assets/css/geral.css">
        <link rel="stylesheet" href="assets/css/paginas/nova-senha.css">
        <link rel="stylesheet" href="assets/css/compatibilidade.css">
        <link rel="stylesheet" href="assets/css/botao-jogar.css">
        <script defer src="assets/js/jquery.min.js"></script>
        <script defer src="assets/js/bootstrap.bundle.min.js"></script>
        <script defer src="assets/js/app.js"></script>
    </head>
    <body class="pagina pagina-nova-senha" data-pagina="nova-senha">
        <header class="site-header">
            <p>
                <a href="leaderboard.html">Plataforma de Jogadores</a>
            </p>
            <a class="botao-jogar" href="/jogo/">Jogar agora</a>
            <nav class="site-nav" aria-label="Navegação principal">
                <a data-guest href="login.html" hidden>Entrar</a>
                <a data-guest href="cadastro.html" hidden>Criar conta</a>
                <a data-user href="leaderboard.html" hidden>Leaderboard</a>
                <a data-user href="perfil.html" hidden>Meu perfil</a>
                <a data-moderator href="moderacao.html" hidden>Moderação</a>
                <a data-moderator href="historico.html" hidden>Histórico</a>
                <form id="logout-form" data-user hidden>
                    <button type="submit">Sair</button>
                </form>
            </nav>
        </header>
        <main id="conteudo" class="site-main">
            <h1>Definir nova senha</h1>
            <p id="message" class="alert" role="status" aria-live="polite" tabindex="-1" hidden></p>
            <p id="loading" role="status">Carregando…</p>
            <div id="page-content" hidden>
                <form id="main-form" data-endpoint="nova-senha">
                    <input type="hidden" name="token" value="">
                    <p>
                        <label for="senha">Nova senha</label>
                        <br>
                        <input
                            id="senha"
                            name="senha"
                            type="password"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >
                        <br>
                        <small>De 8 a 128 caracteres.</small>
                    </p>
                    <p>
                        <label for="confirmacao">Confirme a nova senha</label>
                        <br>
                        <input
                            id="confirmacao"
                            name="confirmacao"
                            type="password"
                            minlength="8"
                            maxlength="128"
                            autocomplete="new-password"
                            required
                        >
                    </p>
                    <button type="submit">Salvar nova senha</button>
                </form>
            </div>
            <noscript>Ative o JavaScript para utilizar o site.</noscript>
        </main>
        <footer class="site-footer">
            <p>Plataforma de Jogadores</p>
        </footer>
    </body>
</html>
