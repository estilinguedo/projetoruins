# sudo cp deploy/plataforma-jogadores.conf /etc/apache2/conf-available/
RedirectMatch 302 ^/PlataformaJogadores$ /PlataformaJogadores/
Alias /PlataformaJogadores/ /var/www/PlataformaJogadores/public/
<Directory /var/www/PlataformaJogadores/public>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    Require all granted
    DirectoryIndex login.html
</Directory>
