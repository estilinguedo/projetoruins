# Instalação separada para a apresentação escolar.
RedirectMatch 302 ^/PlataformaJogadoresEscola$ /PlataformaJogadoresEscola/
Alias /PlataformaJogadoresEscola/ /var/www/PlataformaJogadoresEscola/public/
<Directory /var/www/PlataformaJogadoresEscola/public>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    Require all granted
    DirectoryIndex login.html
    <IfModule php_module>
        php_value post_max_size 8M
    </IfModule>
</Directory>
